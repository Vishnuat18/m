<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Sketchbook ✦ A Romantic Scrapbook</title>
  
  <!-- Google Fonts for Scrapbook Aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cinzel:wght@600;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,800;1,400;1,600&family=Reenie+Beanie&family=Special+Elite&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Floating Background Particles (Stars & Petals) -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Preload Heart Loader -->
  <div id="loader">
    <div class="heart-pulse">♥</div>
    <p class="loader-text">binding pages with love...</p>
  </div>

  <!-- Music Toggle Control -->
  <button id="music-btn" aria-label="Toggle Background Music" title="Play romantic music">
    <span class="music-icon">♫</span>
    <span class="sound-waves">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </span>
  </button>
  <audio id="bg-audio" loop preload="auto"></audio>

  <!-- Navigation Arrows (Desktop / Tablet) -->
  <button id="prev-btn" class="nav-arrow left" aria-label="Previous Page" title="Previous Page">‹</button>
  <button id="next-btn" class="nav-arrow right" aria-label="Next Page" title="Next Page">›</button>

  <!-- Main Viewport Container -->
  <main class="app-container">
    
    <!-- 9:16 Portrait Sketchbook Frame -->
    <div class="sketchbook-viewport">
      
      <!-- Spiral Metal Binding on Left Edge -->
      <div class="spiral-binding" aria-hidden="true">
        <div class="holes-strip"></div>
        <div class="coils-wrap" id="coils-container">
          <!-- Dynamically generated spiral SVG rings -->
        </div>
      </div>

      <!-- 3D Book & Pages Container -->
      <div class="book-3d" id="book">
        <!-- Pages will be rendered here dynamically from script.js (BOOK config) -->
      </div>

      <!-- Touch / Click Hit Zones for Seamless Flipping -->
      <div class="hit-zone left" id="hit-prev" title="Tap to flip back"></div>
      <div class="hit-zone right" id="hit-next" title="Tap to flip next"></div>

    </div>

    <!-- Editable Cover Caption & Navigation Bar -->
    <footer class="book-caption-bar">
      <p id="cover-caption" class="caption-text"></p>
      <div class="page-indicator">
        <span id="current-page-num">1</span>
        <span class="sep">/</span>
        <span id="total-pages-num">8</span>
      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
