<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Happy Birthday Maheswari &mdash; Interactive Birthday Trail Phone</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #06040a;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .font-serif-title { font-family: 'Cinzel', serif; }
    .font-serif-clean { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-hand { font-family: 'Caveat', cursive; }

    /* Phone Shell Stage */
    .phone-stage {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 844px;
      background: #09080e;
      border-radius: 46px;
      border: 4px solid #1f1b2c;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(255, 255, 255, 0.08),
                  0 0 0 12px #2f2b3e;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Mobile Viewport Optimization */
    @media (max-width: 600px) {
      .phone-stage {
        padding: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      .phone-frame {
        max-width: 100%;
        max-height: 100%;
        width: 100%;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
        border: none;
      }
      .dynamic-island {
        display: none !important;
      }
    }

    /* Hardware Elements (Desktop only) */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 28px;
      background: #000000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .camera-lens {
      width: 11px;
      height: 11px;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
    }
    .sensor-dot {
      width: 6px;
      height: 6px;
      background: #1e1b4b;
      border-radius: 50%;
    }

    /* Top Status Bar */
    #statusBar {
      height: 44px;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 30;
      user-select: none;
    }

    /* Single Screen Container */
    .phone-single-screen {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 15%, #22153c 0%, #0d0818 60%, #050309 100%);
      padding: 14px 16px 16px 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* App Icons & Styling */
    .app-icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
      transition: transform 0.15s ease;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
    }
    .app-icon-btn:active { transform: scale(0.92); }
    .app-tile {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }
    .app-label {
      font-size: 11px;
      color: #f1f5f9;
      font-weight: 500;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      display: block;
    }

    /* Dedicated Phone Dock */
    .phone-dock-bar {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 26px;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      margin-top: 10px;
    }
    .dock-tile {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Modal Backdrop */
    .app-modal {
      position: absolute;
      inset: 0;
      background: #090b14;
      z-index: 40;
      display: flex;
      flex-direction: column;
      animation: appOpen 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes appOpen {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">

      <!-- Dynamic Island (Desktop mockup only) -->
      <div class="dynamic-island">
        <div class="sensor-dot"></div>
        <div class="camera-lens"></div>
      </div>

      <!-- STATUS BAR -->
      <div id="statusBar">
        <span id="clockDisplay" class="text-xs font-semibold tracking-wider text-slate-200">23:56</span>
        <span class="font-serif-title text-[11px] tracking-widest text-amber-200 uppercase">Maheswari</span>
        <div class="flex items-center gap-1.5 text-slate-300">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.2.2-.2.51 0 .71.1.1.23.15.35.15s.26-.05.35-.15l1.83-1.83C8.34 19.39 10.1 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
          </svg>
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.5 0 6.69 1.34 9.12 3.53L12 19.42 2.88 11.03C5.31 8.84 8.5 7.5 12 7.5z"/>
          </svg>
          <div class="w-5 h-2.5 border border-slate-300 rounded-[3px] p-[1px] flex items-center">
            <div class="w-full h-full bg-emerald-400 rounded-[1px]"></div>
          </div>
        </div>
      </div>

      <!-- ==================== SINGLE WORKABLE HOME SCREEN ==================== -->
      <div class="phone-single-screen">
        <!-- Top Celebration Header -->
        <div class="text-center mb-5 px-1">
          <div class="inline-block text-[9px] font-bold tracking-[2px] text-pink-300 bg-pink-500/10 border border-pink-400/30 px-3 py-1 rounded-full uppercase font-serif-title mb-2">
            A SPECIAL BIRTHDAY CELEBRATION
          </div>
          <h1 class="text-2xl font-serif-clean font-semibold text-purple-100 leading-tight">
            Happy Birthday Maheswari
          </h1>
          <p class="text-[11px] text-purple-300/80 mt-1">Handcrafted with love for Ammu</p>
        </div>

        <!-- 8-APP MAIN GRID (2 rows of 4 apps) -->
        <div class="grid grid-cols-4 gap-y-4 gap-x-2.5 w-full mb-auto">
          <!-- 1. Scrapbook -->
          <button class="app-icon-btn" data-app="scrapbook">
            <div class="app-tile bg-gradient-to-tr from-[#7c4d32] to-[#c89666] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                <path d="M8 7h8m-8 4h5"/>

            </div>
            <span class="app-label">Scrapbook</span>
          </button>

          <!-- 2. Diary(Notes) -->
          <button class="app-icon-btn" data-app="diary">
            <div class="app-tile bg-gradient-to-tr from-[#3b2d54] to-[#7952b3] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>

            </div>
            <span class="app-label">Diary(Notes)</span>

          <!-- 3. Gallery -->
          <button class="app-icon-btn" data-app="gallery">
            <div class="app-tile bg-gradient-to-tr from-[#831843] to-[#db2777] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
            <span class="app-label">Gallery</span>
          </button>

          <!-- 4. Ingram (Instagram Feed) -->
          <button class="app-icon-btn" data-app="ingram">
            <div class="app-tile bg-gradient-to-tr from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
              </svg>
            </div>
            <span class="app-label">Ingram</span>
          </button>

          <!-- 5. Make Arrow Game (Attachment 1) -->
          <button class="app-icon-btn" data-app="arrowGame">
            <div class="app-tile bg-gradient-to-tr from-[#065f46] to-[#10b981] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="12 8 8 12 12 16 12 8"/>
                <line x1="12" y1="12" x2="16" y2="12"/>
              </svg>
            </div>
            <span class="app-label">Make Arrow</span>
          </button>

          <!-- 6. Calculator -->
          <button class="app-icon-btn" data-app="calculator">
            <div class="app-tile bg-gradient-to-tr from-[#334155] to-[#64748b] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <line x1="8" y1="6" x2="16" y2="6"/>
                <line x1="16" y1="14" x2="16" y2="18"/>
                <path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/>
              </svg>
            </div>
            <span class="app-label">Calculator</span>
          </button>

          <!-- 7. Settings -->
          <button class="app-icon-btn" data-app="settings">
            <div class="app-tile bg-gradient-to-tr from-[#1e293b] to-[#475569] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </div>
            <span class="app-label">Settings</span>
          </button>

          <!-- 8. Special Gift -->
          <button class="app-icon-btn" data-app="gift">
            <div class="app-tile bg-gradient-to-tr from-[#b45309] to-[#f59e0b] text-white">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="8" width="18" height="4" rx="1"/>
                <path d="M12 8v13"/>
                <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
                <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
              </svg>
            </div>
            <span class="app-label">Special Gift</span>
          </button>
        </div>

        <!-- Sky Dedication Widget (Attachment 8: Looking Up at the Same Sky With You) -->
        <div class="my-3 px-3 py-2.5 rounded-2xl bg-black/45 border border-white/10 backdrop-blur-md flex items-center gap-3">
          <div class="w-11 h-16 shrink-0 flex items-center justify-center">
            <img src="/assets/pose-01.png" alt="Maheswari looking up" class="h-full object-contain filter drop-shadow(0 4px 8px rgba(0,0,0,0.6))" onerror="this.src='assets/pose-01.png'" />
          </div>
          <div class="flex-1">
            <p class="text-[12px] text-amber-200 leading-snug font-serif-clean italic">
              &ldquo;Looking up at the same sky with you... always.&rdquo;
            </p>
            <div class="text-[9px] text-slate-400 mt-0.5 tracking-wider font-serif-title uppercase">&mdash; VISHNU</div>
          </div>
        </div>

        <!-- BOTTOM DOCK (Messages, Phone, Mail, Browser) -->
        <div class="phone-dock-bar">
          <!-- Phone -->
          <button class="app-icon-btn" data-app="phone">
            <div class="dock-tile bg-gradient-to-tr from-[#059669] to-[#10b981] text-white">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
              </svg>
            </div>
          </button>

          <!-- Messages -->
          <button class="app-icon-btn" data-app="messages">
            <div class="dock-tile bg-gradient-to-tr from-[#16a34a] to-[#22c55e] text-white">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
              </svg>
            </div>
          </button>

          <!-- Mail -->
          <button class="app-icon-btn" data-app="mail">
            <div class="dock-tile bg-gradient-to-tr from-[#0284c7] to-[#38bdf8] text-white">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
          </button>

          <!-- Browser -->
          <button class="app-icon-btn" data-app="browser">
            <div class="dock-tile bg-gradient-to-tr from-[#4f46e5] to-[#6366f1] text-white">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                <polygon points="12 8 8 16 16 12 12 8"/>
              </svg>
            </div>
          </button>
        </div>
      </div>

      <!-- ==================== APP MODAL OVERLAY ==================== -->
      <div id="appOverlay" class="app-modal hidden">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // State
    const state = {
      activeApp: null,
      messages: [
        { sender: 'vishnu', text: 'Happy Birthday Maheswari! Wishing you the most magical and joyful day ever!', time: '10:00' },
        { sender: 'vishnu', text: 'I crafted this digital phone world with love just for you.', time: '10:01' },
        { sender: 'vishnu', text: 'Looking up at the same sky with you... always.', time: '10:02' }
      ],
      callTimer: 0,
      callInterval: null,
      calcDisplay: '0',
      calcSecret: null,
      arrowStep: 0,
      arrowVisited: [[0, 0]],
      arrowWon: false
    };

    // Attachment 1 Sequence of 8 Arrows across 3x3 grid
    const arrowSequence = [
      { dir: '→', r: 0, c: 1, name: 'Right' },
      { dir: '↓', r: 1, c: 1, name: 'Down' },
      { dir: '↗', r: 0, c: 2, name: 'Up-Right' },
      { dir: '↓', r: 1, c: 2, name: 'Down' },
      { dir: '↓', r: 2, c: 2, name: 'Down' },
      { dir: '←', r: 2, c: 1, name: 'Left' },
      { dir: '←', r: 2, c: 0, name: 'Left' },
      { dir: '↑', r: 1, c: 0, name: 'Up' }
    ];

    // Sound Synthesizer via Web Audio API
    function playAudio(freq = 480, dur = 0.08, type = 'sine') {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur + 0.01);
      } catch (e) {}
    }

    function triggerConfetti() {
      if (window.confetti) {
        window.confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#ff9ffc', '#e5a93c', '#38bdf8', '#c084fc', '#ffffff']
        });
      }
    }

    // App Opener
    function openApp(appId) {
      playAudio(520, 0.08, 'triangle');
      const overlay = document.getElementById('appOverlay');

      if (appId === 'scrapbook') {
        window.location.href = '/';
        return;
      }
      if (appId === 'diary') {
        window.location.href = '/';
        return;
      }

      overlay.classList.remove('hidden');

      if (appId === 'arrowGame') renderArrowGame();
      else if (appId === 'ingram') renderIngram();
      else if (appId === 'gallery') renderGallery();
      else if (appId === 'messages') renderMessages();
      else if (appId === 'phone') renderPhone();
      else if (appId === 'mail') renderMail();
      else if (appId === 'calculator') renderCalculator();
      else if (appId === 'browser') renderBrowser();
      else if (appId === 'settings') renderSettings();
      else if (appId === 'gift') renderGift();
    }

    function closeApp() {
      playAudio(400, 0.06, 'triangle');
      const overlay = document.getElementById('appOverlay');
      overlay.classList.add('hidden');
      overlay.innerHTML = '';
      if (state.callInterval) { clearInterval(state.callInterval); state.callInterval = null; }
    }

    function modalHeader(title, bgClass = 'bg-[#111827]') {
      return `
        <div class="${bgClass} px-4 py-3 flex items-center justify-between border-b border-white/10 shrink-0">

    /* 1. MAKE ARROW GAME */
    function renderArrowGame() {
      const overlay = document.getElementById('appOverlay');
      overlay.innerHTML = `
        ${modalHeader('Make Arrow Game', 'bg-emerald-950')}
        <div class="flex-1 overflow-y-auto p-4 flex flex-col items-center gap-4 text-center">
          <p class="text-xs text-emerald-200">
            Follow the 8-arrow trail across the 3x3 grid to unlock the path to Vishnu's heart!
          </p>

          <div class="grid grid-cols-3 gap-3 p-4 bg-emerald-950/60 border border-emerald-500/30 rounded-2xl shadow-xl">
            ${[0, 1, 2].map(r => [0, 1, 2].map(c => {
              const isVisited = state.arrowVisited.some(([vr, vc]) => vr === r && vc === c);
              const isStart = r === 0 && c === 0;
              const isTarget = !state.arrowWon && arrowSequence[state.arrowStep]?.r === r && arrowSequence[state.arrowStep]?.c === c;
              return `
                <button onclick="clickCell(${r}, ${c})" class="w-16 h-16 rounded-xl border flex items-center justify-center text-lg transition ${
                  isVisited ? 'bg-emerald-600/60 border-emerald-400 text-amber-300 shadow-md' : 'bg-white/5 border-white/20 text-white'
                } ${isTarget ? 'border-amber-400 animate-pulse' : ''}">
                  ${isStart ? '<span class="text-emerald-400 text-xl font-bold">&bull;</span>' : (isVisited ? '<svg class="w-4 h-4 text-amber-300 inline" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' : '')}
                </button>
              `;
            }).join('')).join('')}
          </div>

          <div class="flex items-center gap-1.5 p-2 bg-black/40 border border-white/10 rounded-xl overflow-x-auto max-w-full">
            ${arrowSequence.map((step, idx) => {
              const passed = idx < state.arrowStep || state.arrowWon;
              const active = idx === state.arrowStep && !state.arrowWon;
              return `
                <button onclick="advanceArrow(${idx})" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold border transition ${
                  active ? 'bg-emerald-500 border-emerald-300 text-white shadow-lg scale-110' : (passed ? 'bg-emerald-900/60 border-emerald-600 text-emerald-300' : 'bg-white/5 border-white/10 text-slate-300')
                }">
                  ${step.dir}
                </button>
              `;
            }).join('')}
          </div>

          ${state.arrowWon ? `
            <div class="bg-emerald-900/80 border border-emerald-400 p-4 rounded-xl max-w-xs animate-bounce flex flex-col items-center">
              <svg class="w-8 h-8 text-pink-400 mb-1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <h3 class="font-serif-title text-base text-white">Path Completed!</h3>
              <p class="font-serif-clean italic text-sm text-emerald-100 mt-1">
                &ldquo;Every direction in life leads straight to you. Happy Birthday Maheswari!&rdquo;
              </p>
              <button onclick="resetArrowGame()" class="mt-3 px-4 py-1.5 bg-emerald-500 rounded-full text-xs font-semibold text-white">Play Again</button>
            </div>
          ` : `
            <p class="text-xs text-emerald-300">Tap next step: ${state.arrowStep + 1} of 8 (${arrowSequence[state.arrowStep]?.name})</p>
          `}
        </div>
      `;
    }

    window.clickCell = (r, c) => {
      if (state.arrowWon) return;
      const t = arrowSequence[state.arrowStep];
      if (t && t.r === r && t.c === c) advanceArrow(state.arrowStep);
      else playAudio(350, 0.05);
    };

    window.advanceArrow = (idx) => {
      if (state.arrowWon) return;
      if (idx === state.arrowStep) {
        playAudio(660, 0.1, 'sine');
        const next = arrowSequence[idx];
        state.arrowVisited.push([next.r, next.c]);
        if (idx + 1 >= arrowSequence.length) {
          state.arrowWon = true;
          playAudio(880, 0.3, 'sine');
          triggerConfetti();
        } else {
          state.arrowStep++;
        }
        renderArrowGame();
      }
    };

    window.resetArrowGame = () => {
      state.arrowStep = 0;
      state.arrowVisited = [[0, 0]];
      state.arrowWon = false;
      renderArrowGame();
    };

              <button onclick="pressCalc('${b}')" class="h-12 rounded-full font-bold text-sm transition ${
                b === '=' ? 'bg-emerald-500 text-white' : (['/','*','-','+'].includes(b) ? 'bg-amber-500 text-white' : 'bg-slate-800 text-slate-100')

    window.pressCalc = (b) => {
      playAudio(480, 0.05);
      const scr = document.getElementById('calcScreen');
      const msg = document.getElementById('calcSecretMsg');
      if (b === 'C') {
        state.calcDisplay = '0';
        if (scr) scr.innerText = '0';
        if (msg) msg.innerText = '';
        return;
      }
      if (b === '=') {
        if (state.calcDisplay === '2211' || state.calcDisplay === '1204') {
          playAudio(780, 0.2);
          triggerConfetti();
          if (msg) msg.innerText = 'Passcode 2211: "Vishnu loves you to infinity and beyond!"';
          return;
        }
        try {
          // Safe evaluation
          const val = Function('"use strict";return (' + state.calcDisplay.replace(/[^0-9+\-*/.]/g, '') + ')')();
          state.calcDisplay = String(val);
          if (scr) scr.innerText = state.calcDisplay;
        } catch (e) {
          if (scr) scr.innerText = 'Error';
        }
        return;
      }
      state.calcDisplay = state.calcDisplay === '0' ? b : state.calcDisplay + b;
      if (scr) scr.innerText = state.calcDisplay;
    };
